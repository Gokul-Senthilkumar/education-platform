apiVersion: apps/v1
kind: Deployment
metadata:
  name: education-platform
  namespace: education-platform
  labels:
    app.kubernetes.io/name: education-platform
    app.kubernetes.io/part-of: education-platform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: education-platform
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: education-platform
        app.kubernetes.io/part-of: education-platform
    spec:
      serviceAccountName: education-platform-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: education-platform
          image: 498524284921.dkr.ecr.us-east-1.amazonaws.com/education-platform:REPLACE_WITH_GIT_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DB_URL
              value: "jdbc:mysql://education-platform-db.cdaekobuju99.us-east-1.rds.amazonaws.com:3306/education_platform"
            - name: DB_USERNAME
              value: "eduapp"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: education-platform-db-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
