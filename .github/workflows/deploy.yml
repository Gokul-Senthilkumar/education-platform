name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and Test
        run: mvn clean package

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::648070841242:role/GitHubActions-ECS-Deploy-Role
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t education-platform:${{ github.sha }} .

      - name: Tag Docker Image
        run: docker tag education-platform:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/education-platform:${{ github.sha }}

      - name: Push Docker Image
        run: docker push ${{ steps.login-ecr.outputs.registry }}/education-platform:${{ github.sha }}

      - name: Download Task Definition
        run: aws ecs describe-task-definition --task-definition education-platform-task --query taskDefinition > task-definition.json

      - name: Render Amazon ECS Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: Main
          image: ${{ steps.login-ecr.outputs.registry }}/education-platform:${{ github.sha }}

      - name: Deploy Amazon ECS Task Definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: education-platform-service
          cluster: education-platform-cluster
          wait-for-service-stability: true