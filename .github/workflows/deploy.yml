name: Deploy Education Platform to Amazon EKS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: education-platform-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: eks-cicd
  ECR_REPOSITORY: education-platform
  K8S_NAMESPACE: education-platform
  K8S_DEPLOYMENT: education-platform
  K8S_CONTAINER: education-platform

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and Test
        run: mvn --batch-mode clean verify

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::100379913615:role/GitHubActions-EducationPlatform-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check for Existing Immutable Image
        id: image-check
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          ERROR_FILE=$(mktemp)
          trap 'rm -f "$ERROR_FILE"' EXIT

          if aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            >/dev/null 2>"$ERROR_FILE"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists; it will be reused."
          elif grep -q "ImageNotFoundException" "$ERROR_FILE"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image does not exist yet; it will be built."
          else
            cat "$ERROR_FILE"
            exit 1
          fi

      - name: Pull Existing Image
        if: steps.image-check.outputs.exists == 'true'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker pull "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Build Docker Image
        if: steps.image-check.outputs.exists == 'false'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

      - name: Push Image to ECR
        if: steps.image-check.outputs.exists == 'false'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Apply Application Manifests
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl apply -f k8s/serviceaccount.yaml
          kubectl apply -f k8s/service.yaml

          sed "s|REPLACE_WITH_GIT_SHA|$IMAGE_TAG|g" \
            k8s/deployment.yaml | kubectl apply -f -

          kubectl apply -f k8s/ingress.yaml

      - name: Wait for Deployment Rollout
        run: |
          kubectl rollout status \
            deployment/"$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            --timeout=5m

      - name: Verify Deployment
        run: |
          kubectl get deployment "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE"

          kubectl get pods \
            --namespace "$K8S_NAMESPACE" -o wide

          kubectl get services \
            --namespace "$K8S_NAMESPACE"

          kubectl get ingress \
            --namespace "$K8S_NAMESPACE"