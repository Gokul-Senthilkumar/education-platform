
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login | Learning Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="container">
        <h1>Welcome Back!</h1>
        <p style="text-align: center;">
            Sign in to your Employee Learning Portal
        </p>

        <p class="error" th:if="${param.error}">
            Invalid email or password. Please try again.
        </p>

        <p th:if="${param.logout}" style="color: green;">
            You have logged out successfully.
        </p>

        <p th:if="${success}" th:text="${success}"
           style="color: green;"></p>

        <form th:action="@{/login}" method="post">
            <div>
                <label for="username">Work Email</label>
                <input type="email" id="username" name="username"
                       autocomplete="username" required>
            </div>

            <br>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password" required>
            </div>

            <br>

            <button type="submit">Log In</button>
        </form>

        <p style="text-align: center;">
            New employee? <a th:href="@{/register}">Create an account</a>
        </p>

        <p style="text-align: center;">
            <a th:href="@{/}">Back to Home</a>
        </p>
    </div>

</body>
</html>
